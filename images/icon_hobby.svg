<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Subtle Flight Grid Lines -->
  <path d="M12 48 L28 48 L28 54 L44 54 L44 48 L52 48" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 2" stroke-linecap="round"/>
  <circle cx="12" cy="48" r="2.5" fill="#0F766E"/>
  <circle cx="28" cy="48" r="2" fill="#2DD4BF"/>
  <circle cx="28" cy="54" r="2" fill="#2DD4BF"/>
  <circle cx="44" cy="54" r="2" fill="#2DD4BF"/>
  <circle cx="44" cy="48" r="2" fill="#2DD4BF"/>
  <circle cx="52" cy="48" r="2.5" fill="#0F766E"/>

  <!-- Modern Quadcopter Drone -->
  <!-- Diagonal Arms -->
  <line x1="18" y1="18" x2="46" y2="38" stroke="#0F172A" stroke-width="2.75" stroke-linecap="round"/>
  <line x1="18" y1="38" x2="46" y2="18" stroke="#0F172A" stroke-width="2.75" stroke-linecap="round"/>

  <!-- Rotors -->
  <ellipse cx="18" cy="18" rx="8" ry="4" stroke="#0F766E" stroke-width="1.75" fill="#F0FDFA"/>
  <ellipse cx="46" cy="18" rx="8" ry="4" stroke="#0F766E" stroke-width="1.75" fill="#F0FDFA"/>
  <ellipse cx="18" cy="38" rx="8" ry="4" stroke="#0F766E" stroke-width="1.75" fill="#F0FDFA"/>
  <ellipse cx="46" cy="38" rx="8" ry="4" stroke="#0F766E" stroke-width="1.75" fill="#F0FDFA"/>

  <!-- Rotor Hubs -->
  <circle cx="18" cy="18" r="2.5" fill="#0F172A"/>
  <circle cx="46" cy="18" r="2.5" fill="#0F172A"/>
  <circle cx="18" cy="38" r="2.5" fill="#0F172A"/>
  <circle cx="46" cy="38" r="2.5" fill="#0F172A"/>

  <!-- Central Fuselage Body -->
  <rect x="25" y="21" width="14" height="14" rx="4" fill="#0F172A" stroke="#0F766E" stroke-width="1.5"/>
  <!-- Optical Camera Sensor -->
  <circle cx="32" cy="28" r="4" fill="#2DD4BF"/>
  <circle cx="32" cy="28" r="1.5" fill="#042F2E"/>

  <!-- Survey Flight Badge Accent -->
  <rect x="20" y="8" width="24" height="6" rx="3" fill="#E6FFFA" stroke="#0D9488" stroke-width="1"/>
  <text x="32" y="12.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" font-weight="800" fill="#0F766E" text-anchor="middle" letter-spacing="0.5">HOBBY</text>
</svg>
