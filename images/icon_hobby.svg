<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgHobby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="url(#bgHobby)" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Grid Mission Pattern -->
  <path d="M 22 26 L 78 26 L 78 38 L 22 38 L 22 50 L 78 50 L 78 62 L 22 62" fill="none" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="22" cy="26" r="2.5" fill="#2DD4BF"/>
  <circle cx="78" cy="26" r="2" fill="#2DD4BF"/>
  <circle cx="78" cy="38" r="2" fill="#2DD4BF"/>
  <circle cx="22" cy="38" r="2" fill="#2DD4BF"/>
  <circle cx="22" cy="50" r="2" fill="#2DD4BF"/>
  <circle cx="78" cy="50" r="2" fill="#2DD4BF"/>
  <circle cx="78" cy="62" r="2.5" fill="#2DD4BF"/>

  <!-- Drone Icon Center -->
  <g transform="translate(50, 44)">
    <!-- Drone Arms -->
    <line x1="-16" y1="-12" x2="16" y2="12" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="12" x2="16" y2="-12" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <!-- Propellers -->
    <ellipse cx="-16" cy="-12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <ellipse cx="16" cy="-12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <ellipse cx="-16" cy="12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <ellipse cx="16" cy="12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <!-- Drone Body -->
    <rect x="-7" y="-6" width="14" height="12" rx="3" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#2DD4BF"/>
  </g>

  <!-- Tag Hobby -->
  <rect x="20" y="74" width="60" height="18" rx="4" fill="#1E293B" stroke="#374151" stroke-width="1"/>
  <text x="50" y="86.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#2DD4BF" text-anchor="middle" letter-spacing="1">HOBBY</text>
</svg>
