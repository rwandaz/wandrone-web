<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Topographic Terrain Contours (Pro Follow Terrain Feature) -->
  <path d="M10 52 Q22 46 32 49 T54 44" stroke="#94A3B8" stroke-width="1.25" stroke-dasharray="2 2"/>
  <path d="M8 57 Q20 50 32 53 T56 49" stroke="#0F766E" stroke-width="1.5"/>

  <!-- LiDAR / Sensor Scanning Rays -->
  <path d="M26 31 L14 46 M38 31 L50 46" stroke="#2DD4BF" stroke-width="1.25" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Enterprise Quadcopter Drone -->
  <!-- Diagonal Arms -->
  <line x1="16" y1="16" x2="48" y2="38" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="38" x2="48" y2="16" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

  <!-- Heavy Rotors -->
  <ellipse cx="16" cy="16" rx="9" ry="4.5" stroke="#0F766E" stroke-width="1.75" fill="#CCFBF1"/>
  <ellipse cx="48" cy="16" rx="9" ry="4.5" stroke="#0F766E" stroke-width="1.75" fill="#CCFBF1"/>
  <ellipse cx="16" cy="38" rx="9" ry="4.5" stroke="#0F766E" stroke-width="1.75" fill="#CCFBF1"/>
  <ellipse cx="48" cy="38" rx="9" ry="4.5" stroke="#0F766E" stroke-width="1.75" fill="#CCFBF1"/>

  <!-- Rotor Hubs -->
  <circle cx="16" cy="16" r="2.75" fill="#0F172A"/>
  <circle cx="48" cy="16" r="2.75" fill="#0F172A"/>
  <circle cx="16" cy="38" r="2.75" fill="#0F172A"/>
  <circle cx="48" cy="38" r="2.75" fill="#0F172A"/>

  <!-- Heavy Fuselage Body -->
  <rect x="23" y="19" width="18" height="16" rx="4" fill="#0F172A" stroke="#2DD4BF" stroke-width="1.5"/>
  
  <!-- Optical & LiDAR Sensor Core -->
  <circle cx="32" cy="27" r="4.5" fill="#2DD4BF"/>
  <circle cx="32" cy="27" r="2" fill="#042F2E"/>

  <!-- Enterprise Pro Badge Accent -->
  <rect x="22" y="7" width="20" height="6" rx="3" fill="#0F172A" stroke="#2DD4BF" stroke-width="1"/>
  <text x="32" y="11.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" font-weight="800" fill="#2DD4BF" text-anchor="middle" letter-spacing="0.5">PRO</text>
</svg>
