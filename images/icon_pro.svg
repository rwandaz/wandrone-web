<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgPro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="url(#bgPro)" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Terrain Elevation Curves -->
  <path d="M 16 66 Q 32 50 48 58 T 84 46" fill="none" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1.5" stroke-dasharray="3 2"/>
  <path d="M 16 52 Q 32 36 48 44 T 84 32" fill="none" stroke="#2DD4BF" stroke-width="1.8"/>

  <!-- Drone Icon Center -->
  <g transform="translate(50, 36)">
    <!-- Drone Arms -->
    <line x1="-16" y1="-12" x2="16" y2="12" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="12" x2="16" y2="-12" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <!-- Propellers -->
    <ellipse cx="-16" cy="-12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <ellipse cx="16" cy="-12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <ellipse cx="-16" cy="12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <ellipse cx="16" cy="12" rx="7" ry="2.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
    <!-- Drone Body -->
    <rect x="-7" y="-6" width="14" height="12" rx="3" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#2DD4BF"/>
  </g>

  <!-- Tag Pro -->
  <rect x="20" y="74" width="60" height="18" rx="4" fill="#1E293B" stroke="#374151" stroke-width="1"/>
  <text x="50" y="86.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#2DD4BF" text-anchor="middle" letter-spacing="1.5">⚡ PRO</text>
</svg>
